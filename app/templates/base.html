<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=4">
  <script defer src="{{ url_for('static', path='app.js') }}?v=4"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">IF</span>
      <span>{{ app_name }}</span>
    </a>
    {% if participant %}
      <span class="participant-code">참여 코드 {{ participant.participant_id }}</span>
    {% endif %}
  </header>
  <main class="page-shell">
    {% if error %}
      <div class="alert" role="alert">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    연구용 프로토타입 · 모든 자극 이미지는 저장된 잠재벡터에서 생성됩니다.
  </footer>
  <div class="loading-screen" data-loading-screen hidden aria-live="polite">
    <div class="loading-card" role="status">
      <img
        class="loading-kitty"
        src="{{ url_for('static', path='loading-kitty.png') }}"
        alt="귀여운 고양이가 얼굴을 준비하는 모습"
      >
      <strong>잠시만요!</strong>
      <span>귀여운 얼굴을 준비하고 있어요<span class="loading-dots">...</span></span>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
