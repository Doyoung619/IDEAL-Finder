generator:
  mode: "stylegan2_ada"
  network_path: "${STYLEGAN2_FFHQ_PKL}"
  stylegan_repo: "${STYLEGAN2_ADA_REPO}"
  device: "cuda"
  truncation_psi: 0.7
  noise_mode: "const"

demographic:
  classifier: "fairface"
  weights: "${FAIRFACE_WEIGHTS}"
  gender: "female"
  race_targets: ["east_asian"]
  gender_threshold: 0.90
  race_threshold: 0.80

conditional_prior:
  artifact_path: "artifacts/priors/female_east_asian_d12.npz"
  latent_space: "w"
  dimension: 12
  selection_mode: "hard"
  num_generator_samples: 50000
  min_accepted_samples: 2000
  covariance_eps: 1.0e-6
  covariance_shrinkage: 0.01
  seed: 42

query:
  strategy: "demographic_constrained_mvlq"
  num_options: 5
  radius_mode: "initial_max_std"
  backtrack_factor: 0.8
  min_alpha: 0.1
  max_backtracking_steps: 15
  center_candidates: 16

preference:
  beta: 1.0
  distance_space: "theta"
