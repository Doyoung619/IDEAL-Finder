app:
  name: "이상형 탐지기"
  host: "127.0.0.1"
  port: 8000
  secret_key: "change-this-before-data-collection"
  debug: false
  consent_version: "unspecified"
  secure_cookies: false

database:
  url: "sqlite:///data/ideal_type_detector.sqlite3"

storage:
  persist_artifacts_in_db: false

paths:
  data_dir: "data"
  cache_dir: "cache"
  output_dir: "outputs"
  model_dir: "models"

generator:
  mode: "stylegan2_ada"
  device: "auto"
  output_resolution: 256
  batch_size: 8
  truncation_psi: 0.7
  noise_mode: "const"
  stylegan_repo: "models/stylegan2-ada-pytorch"
  network_path: "models/stylegan2-ffhq-256x256.pkl"
  network_url: "https://api.ngc.nvidia.com/v2/models/nvidia/research/stylegan2/versions/1/files/stylegan2-ffhq-256x256.pkl"
  demo_latent_dim: 32

experiment:
  seed: 20260730
  m_list: [8, 4, 2]
  algorithm_order: ["entropy", "rc_mlq"]
  rounds_per_m: 12
  answer_key_faces: 20
  recommendation_conditions: ["none", "basic_info", "click_profile", "selection_history"]
  recommendation_batches_per_condition: 1
  recommendation_set_size: 16
  candidate_pool_size: 64
  candidate_pool_multiplier: 4

search:
  version: "rc_mlq_v4_randomized_entropy_spread14"
  pca_dimensions: 32
  pca_fit_samples: 512

filters:
  minimum_quality: 0.18
  gender_confidence_threshold: 0.58
  adult_confidence_threshold: 0.56
  portrait_confidence_threshold: 0.50
  east_asian_confidence_threshold: 0.50
  east_asian_boost_fraction: 0.75
  balanced_east_asian_fraction: 0.40
  twenties_boost_fraction: 0.75
  twenties_thirties_fraction: 0.90
  east_asian_candidate_pool_minimum: 512
  max_filter_attempts: 4
  strict_gender: true

clip:
  enabled: true
  model_name: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  device: "auto"
  batch_size: 16

demographic:
  classifier: "fairface"
  weights: "models/fairface_res34.pth"
  device: "auto"
  batch_size: 32
  gender: "female"
  race_targets: []
  gender_threshold: 0.90
  race_threshold: 0.80

conditional_prior:
  artifact_path: "artifacts/priors/{gender}_20_29_d12.npz"
  latent_space: "w"
  dimension: 12
  selection_mode: "hard"
  num_generator_samples: 50000
  min_accepted_samples: 2000
  covariance_eps: 1.0e-6
  covariance_shrinkage: 0.01
  seed: 42

query:
  algorithm: "entropy"
  num_options: 5
  posterior_mc_samples: 512
  num_restarts: 8
  optimization_steps: 200
  learning_rate: 0.05
  entropy_output_spread_scale: 1.4
  constraint: "prior_ellipsoid"
  seed: 0
  beta: 1.0
  adaptive_beta_enabled: true
  beta_min: 0.35
  beta_max: 2.5
  beta_smoothing: 0.30
  rc_resolution_min: 0.2
  rc_resolution_max: 6.0
  rc_resolution_steps: 120
  rc_posterior_samples: 4096

query_diversity:
  enabled: false
  latent_min_distance: 0.15
  image_similarity_threshold: null
  max_retries: 3
  perturbation_initial: 0.10
  perturbation_max: 0.40
  max_relative_ig_loss: 0.05
  radius_expansion_factors: [1.1, 1.2, 1.35]
  orthogonal_fallback: true

persona:
  enabled: true
  required: true
  schema_version: "persona_v1"
  fixed_race: "unrestricted"
  fixed_age_range: "20_29"
  pool_root: "artifacts/persona_pools"
  female_pool: "artifacts/persona_pools/female_20_29_d12"
  male_pool: "artifacts/persona_pools/male_20_29_d12"
  candidate_count: 8
  shortlist_size: 64
  max_candidate_pages: 3
  mmr_lambda: 0.75
  require_real_clip: true
  allow_free_text: false
  prior_covariance_scale: 0.35
  global_mixture_weight: 0.45
  global_covariance_scale: 1.0
  mixture_particle_count: 8192
  semantic_weights:
    base: 0.25
    full: 0.40
    categories: 0.35
  priority_multiplier: 2.0

persona_pool:
  target_size: 3000
  minimum_usable_size: 1000
  max_generated: 100000
  batch_size: 32
  gender_threshold: 0.80
  age_20_29_threshold: 0.55
  minimum_quality: 0.18
  require_exactly_one_face: true

evaluation:
  answer_key_enabled: false
  final_refinement_enabled: true

demo:
  m_list: [8, 4, 2]
  rounds_per_m: 1
  answer_key_faces: 3
  recommendation_batches_per_condition: 1
  recommendation_set_size: 4
  candidate_pool_size: 32
  candidate_pool_multiplier: 4
  query:
    posterior_mc_samples: 64
    num_restarts: 2
    optimization_steps: 30
    rc_posterior_samples: 512
  mixture_particle_count: 1024
  persona_pool_target_size: 32
  persona_pool_minimum_usable_size: 8
