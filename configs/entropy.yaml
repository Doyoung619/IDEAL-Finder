generator:
  mode: "stylegan2_ada"
  network_path: "${STYLEGAN2_FFHQ_PKL}"
  stylegan_repo: "${STYLEGAN2_ADA_REPO}"
  device: "cuda"
  truncation_psi: 0.7
  noise_mode: "const"

demographic:
  classifier: "fairface"
  gender: "female"
  race_targets: ["east_asian"]
  gender_threshold: 0.90
  race_threshold: 0.80

conditional_prior:
  artifact_path: "artifacts/priors/{gender}_east_asian_d12.npz"
  latent_space: "w"
  dimension: 12
  selection_mode: "hard"
  num_generator_samples: 50000
  min_accepted_samples: 2000
  covariance_eps: 1.0e-6
  covariance_shrinkage: 0.01
  seed: 42

query:
  algorithm: "entropy"
  num_options: 5
  posterior_mc_samples: 512
  num_restarts: 8
  optimization_steps: 200
  learning_rate: 0.05
  exploration_radius: 5.0
  constraint: "prior_ellipsoid"
  seed: 0
